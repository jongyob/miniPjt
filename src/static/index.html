<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 품질 리포트 Agent</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 22px; }
  p.desc { color: #555; line-height: 1.5; }
  button {
    font-size: 16px;
    padding: 10px 28px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #status { margin-top: 20px; min-height: 24px; }
  .progress-bar {
    width: 100%;
    height: 18px;
    background: #e5e7eb;
    border-radius: 9px;
    overflow: hidden;
    margin: 10px 0;
  }
  .progress-fill {
    height: 100%;
    background: #2563eb;
    transition: width 0.3s ease;
    width: 0%;
  }
  #stepText { font-size: 14px; color: #444; }
  #summary {
    margin-top: 16px;
    padding: 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    display: none;
    line-height: 1.8;
  }
  #reportWrap { margin-top: 16px; display: none; }
  #report {
    font-size: 14px;
    line-height: 1.7;
    background: #fff;
    color: #1a1a1a;
    padding: 20px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    max-height: 640px;
    overflow-y: auto;
  }
  #report h1 { font-size: 18px; margin: 0 0 8px; }
  #report h2 {
    font-size: 16px;
    margin: 20px 0 8px;
    padding-top: 12px;
    border-top: 1px solid #e5e7eb;
  }
  #report h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  #report h3 {
    font-size: 14px;
    margin: 16px 0 6px;
    padding: 6px 10px;
    background: #f1f5f9;
    border-radius: 6px;
  }
  #report ul { margin: 0 0 4px; padding-left: 20px; }
  #report li { margin: 3px 0; }
  #report p { margin: 4px 0; }
  #report code {
    font-family: "Consolas", monospace;
    font-size: 12px;
    background: #f1f5f9;
    padding: 1px 5px;
    border-radius: 4px;
  }
  #report table { border-collapse: collapse; margin: 6px 0 12px; font-size: 13px; }
  #report th, #report td {
    border: 1px solid #e5e7eb;
    padding: 5px 10px;
    text-align: left;
  }
  #report th { background: #f1f5f9; }
  .lang-tag {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    border-radius: 4px;
    background: #dbeafe;
    color: #1e3a8a;
    font-size: 13px;
  }
  .lang-tag.excepted { background: #fef3c7; color: #92400e; }
  .lang-tag.unsupported { background: #fee2e2; color: #991b1b; }
  .lang-tag.failed { background: #ffe4e6; color: #9f1239; }
  .error-box { color: #991b1b; background: #fee2e2; padding: 12px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>코드 품질 리포트 Agent</h1>
  <p class="desc">
    버튼을 누르면 <code>config.yaml</code>의 <code>source</code> 경로에서 자동 감지된
    언어(Vue3/Java/Python 등)를 전부 대상으로 보안·오류·성능 점검을 실행합니다.
    언어별로 따로 실행할 필요는 없습니다 — 감지된 언어를 한 번에 점검합니다.
  </p>

  <button id="runBtn">점검 실행</button>

  <div id="status"></div>
  <div id="summary"></div>
  <div id="reportWrap">
    <h3 id="reportTitle">리포트</h3>
    <div id="report"></div>
  </div>

<script>
const STEP_LABELS = {
  call_security: "보안 점검",
  call_error: "오류 점검",
  call_performance: "성능 점검",
  build_findings: "결과 정리",
  aggregate: "최종 리포트 작성",
};
const LANG_STATUS_LABEL = { excepted: "점검제외", unsupported: "점검불가" };

const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const reportWrapEl = document.getElementById('reportWrap');
const reportEl = document.getElementById('report');

runBtn.addEventListener('click', startScan);

async function startScan() {
  runBtn.disabled = true;
  summaryEl.style.display = 'none';
  reportWrapEl.style.display = 'none';
  statusEl.innerHTML = '<div class="progress-bar"><div class="progress-fill" id="fill"></div></div>' +
                        '<div id="stepText">시작하는 중...</div>';

  let jobId;
  try {
    const res = await fetch('/scan', { method: 'POST' });
    if (!res.ok) throw new Error(`서버 오류 (HTTP ${res.status})`);
    ({ job_id: jobId } = await res.json());
  } catch (err) {
    showError(err.message);
    return;
  }

  const poll = setInterval(() => pollStatus(jobId, poll), 1000);
  pollStatus(jobId, poll);
}

async function pollStatus(jobId, pollHandle) {
  let data;
  try {
    const res = await fetch(`/scan/${jobId}`);
    if (!res.ok) throw new Error(`서버 오류 (HTTP ${res.status})`);
    data = await res.json();
  } catch (err) {
    clearInterval(pollHandle);
    showError(err.message);
    return;
  }

  const done = data.completed_steps.length;
  const fillEl = document.getElementById('fill');
  if (fillEl) fillEl.style.width = `${Math.min(100, (done / data.total_steps) * 100)}%`;

  const stepTextEl = document.getElementById('stepText');
  if (data.status === 'running' && stepTextEl) {
    const doneLabels = data.completed_steps.map(s => STEP_LABELS[s] || s).join(', ') || '없음';
    stepTextEl.textContent = `진행 중... (${done}/${data.total_steps}단계, 완료: ${doneLabels}) — ${data.elapsed_seconds}초 경과`;
  } else if (data.status === 'done') {
    clearInterval(pollHandle);
    statusEl.innerHTML = `✅ 완료! (${data.elapsed_seconds}초 소요)`;
    showSummary(data);
    runBtn.disabled = false;
  } else if (data.status === 'error') {
    clearInterval(pollHandle);
    showError(data.error);
  }
}

// HTML 특수문자 이스케이프 — LLM/스캐너가 만든, 신뢰할 수 없는 텍스트를 `innerHTML`에
// 넣는 모든 곳(리포트 마크다운, 에러 메시지, 감지된 언어 표시 이름)에 공통으로 쓴다.
// **(결정, 2026-09-04 — 소스 전체 재검증 중 발견)** 원래 `renderReportMarkdown()` 안에만
// 있어서 `showError()`/`showSummary()`의 `l.display`는 이스케이프 없이 그대로
// `innerHTML`에 들어가고 있었다 — 지금은 우연히 위험한 문자가 안 나오는 값들이지만
// (에러 메시지는 서버 예외 문자열, `l.display`는 정규식으로 뽑은 버전 문자열), 같은
// 페이지의 다른 곳은 이미 이스케이프를 하고 있어 방어 수준이 들쭉날쭉했다. 최상위로
// 옮겨 전부 같은 함수를 쓰게 한다.
function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// `report.py`가 실제로 만드는 마크다운 부분집합(# ## ### 제목, - 목록, | 표 |, **굵게**,
// `코드`)만 지원하는 최소 렌더러 — 범용 마크다운 라이브러리를 새로 들여오지 않고, 우리가
// 직접 만드는 리포트 형식에 맞춘 렌더링만 한다. LLM/스캐너가 만든 텍스트가 섞여 있으므로
// HTML 특수문자를 먼저 이스케이프해 XSS를 막은 뒤에만 서식 태그를 씌운다.
function renderReportMarkdown(markdown) {
  function inline(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function tableCells(line) {
    // "| a | b |" -> ["a", "b"] — 표 셀 하나(2일차 3번 이후 리포트가 쓰는 단순 표 형식만
    // 지원하면 되므로, 셀 안에 이스케이프된 파이프(`\|`) 같은 건 다루지 않는다.
    return line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
  }

  // Windows에서 저장된 report.md는 CRLF일 수 있다 — 남은 \r이 줄 끝 앵커(`$`) 매칭을
  // 깨뜨리므로(표 구분선 감지 등) 미리 걷어낸다.
  const lines = markdown.split(/\r?\n/);
  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isTableSeparator = /^\|[\s:|-]+\|$/.test(lines[i + 1] || '');
    if (line.startsWith('|') && isTableSeparator) {
      closeList();
      const headerCells = tableCells(line);
      html += '<table><thead><tr>' + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 1; // 구분선(|---|---|) 줄은 건너뛴다
      while (i + 1 < lines.length && lines[i + 1].startsWith('|')) {
        i += 1;
        const rowCells = tableCells(lines[i]);
        html += '<tr>' + rowCells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table>';
    } else if (line.startsWith('### ')) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
    else if (line.startsWith('## ')) { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; }
    else if (line.startsWith('# ')) { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
    else if (line.startsWith('- ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
    } else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeList();
  return html;
}

function showSummary(data) {
  const langHtml = data.languages.map(l => {
    // 어댑터는 정상 연결(활성)돼 있지만 실행 중 실제로 실패한 경우(예: npm 레지스트리
    // 간헐적 장애) — "(점검불가)"/"(점검제외)"와 같은 자리에 "(점검실패)"를 붙인다
    // (사용자 요청, 2026-09-04). 사유는 report_md의 "## 점검 실패" 섹션에 있다.
    const cls = l.failed ? ' failed' : (l.status === 'active' ? '' : ` ${l.status}`);
    const label = l.failed ? ' (점검실패)' : (LANG_STATUS_LABEL[l.status] ? ` (${LANG_STATUS_LABEL[l.status]})` : '');
    return `<span class="lang-tag${cls}">${escapeHtml(l.display)}${escapeHtml(label)}</span>`;
  }).join(' ');

  summaryEl.style.display = 'block';
  summaryEl.innerHTML = `
    <div><strong>감지된 언어:</strong> ${langHtml}</div>
    <div><strong>총 ${data.total}건</strong> — 보안 ${data.counts.security} / 오류 ${data.counts.error} / 성능 ${data.counts.performance}</div>
    <div style="margin-top:6px;color:#666;font-size:13px;">이력 저장됨: <code>reports/${data.report_file}</code> (매 실행마다 새 파일로 남습니다)</div>
  `;

  reportWrapEl.style.display = 'block';
  document.getElementById('reportTitle').textContent = `리포트 (${data.report_file})`;
  reportEl.innerHTML = renderReportMarkdown(data.report_md);
}

function showError(message) {
  statusEl.innerHTML = `<div class="error-box">❌ 오류 발생: ${escapeHtml(message)}</div>`;
  runBtn.disabled = false;
}
</script>
</body>
</html>
